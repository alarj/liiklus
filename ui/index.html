<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="./assets/app.css?v=__STATIC_VERSION__" />
    <title></title>
  </head>
  <body>
    <dialog id="globalLoadingIndicator" class="global-loading" aria-label="Andmeid laetakse">
      <div class="global-loading-panel" role="status" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
        <span data-i18n="common.loading">Andmeid laetakse…</span>
      </div>
    </dialog>
    <section id="loginView" class="card login-card hidden" aria-labelledby="login-title">
      <h1 id="login-title" data-i18n="login.title"></h1>
      <p class="muted" data-i18n="login.help"></p>
      <div id="googleButton"></div>
      <div id="loginMessage" class="message" role="status"></div>
    </section>
    <main id="appShell" class="wrap hidden">
      <header class="site-header">
        <div><h1 data-i18n="app.title"></h1><p class="lead" data-i18n="app.lead"></p></div>
        <div class="user-area"><span id="currentUser"></span><button id="logoutButton" class="secondary-button compact" type="button" data-i18n="auth.logout"></button></div>
      </header>

      <nav class="tabs">
        <button id="analysisTab" class="tab is-active" type="button" data-view="analysis" data-i18n="nav.analysis"></button>
        <button id="trainingTab" class="tab" type="button" data-view="training"><span data-i18n="nav.training"></span> <span id="trainingCount"></span></button>
      </nav>

      <div id="analysisView">

      <section class="card" aria-labelledby="upload-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker" data-i18n="upload.kicker"></p>
            <h2 id="upload-title" data-i18n="upload.title"></h2>
          </div>
          <div class="upload-actions primary-actions">
            <button id="candidateButton" class="secondary-button" type="button" disabled data-i18n="candidate.open"></button>
            <button id="analyzeButton" type="submit" form="detectForm" disabled data-i18n="upload.analyze"></button>
          </div>
        </div>

        <form id="detectForm" novalidate>
          <input id="imageInput" class="visually-hidden" name="file" type="file" accept="image/jpeg,image/png" />
          <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-describedby="upload-help">
            <div class="drop-zone-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" />
              </svg>
            </div>
            <p class="drop-zone-title" data-i18n="upload.drop_title"></p>
            <p id="upload-help" class="muted" data-i18n="upload.drop_help"></p>
            <button id="chooseButton" type="button" data-i18n="upload.choose"></button>
          </div>

          <div id="selectionPanel" class="selection-panel hidden">
            <div class="preview-frame preview-frame-small">
              <img id="sourcePreview" alt="" />
            </div>
            <div class="selection-details">
              <div>
                <p id="selectedFilename" class="filename"></p>
                <p id="selectedFileMeta" class="muted file-meta"></p>
              </div>
              <button id="replaceButton" class="secondary-button" type="button" data-i18n="upload.replace"></button>
            </div>
          </div>

          <div class="analysis-controls">
            <div class="field-group profile-field">
              <label for="profileSelect" data-i18n="upload.profile_label"></label>
              <select id="profileSelect" name="profile"></select>
            </div>
            <div class="field-group confidence-field">
              <label for="confidenceInput" data-i18n="upload.confidence_label"></label>
              <input id="confidenceInput" name="conf" type="number" min="0.01" max="1" step="0.01" inputmode="decimal" data-i18n-placeholder="upload.confidence_placeholder" />
              <p id="confidenceHelp" class="field-help" data-i18n="upload.confidence_help"></p>
            </div>
            <div class="field-group model-field">
              <label for="modelSelect" data-i18n="upload.model_label"></label>
              <select id="modelSelect" name="model"></select>
            </div>
            <label class="switch-row cross-class-switch" for="crossClassDedupInput"><input id="crossClassDedupInput" type="checkbox" /><span class="switch-control" aria-hidden="true"></span><span data-i18n="upload.cross_class_dedup"></span></label>
            <div id="crossClassThresholdGroup" class="field-group cross-class-threshold-field">
              <label for="crossClassIouInput" data-i18n="upload.cross_class_iou_label"></label>
              <input id="crossClassIouInput" name="cross_class_iou_threshold" type="number" min="0.01" max="1" step="0.01" inputmode="decimal" />
            </div>
            <label class="switch-row three-levels-switch" for="threeLevelsInput"><input id="threeLevelsInput" type="checkbox" /><span class="switch-control" aria-hidden="true"></span><span data-i18n="upload.three_levels"></span></label>
          </div>
          <div id="detectionAreaRow" class="detection-area-row hidden"><label class="switch-row detection-area-switch" for="detectionAreaInput"><input id="detectionAreaInput" type="checkbox" checked /><span class="switch-control" aria-hidden="true"></span><span data-i18n="upload.show_detection_area"></span></label></div>
        </form>

        <div id="requestMessage" class="message" role="status" aria-live="polite"></div>
      </section>

      <section id="resultsCard" class="card hidden" aria-labelledby="results-title">
        <div class="section-heading results-heading">
          <div>
            <p class="section-kicker" data-i18n="results.kicker"></p>
            <h2 id="results-title" data-i18n="results.title"></h2>
          </div>
          <span id="resultStatus" class="status-badge is-success" data-i18n="results.ready"></span>
        </div>

        <div id="trainingHistory" class="history-panel hidden"></div>
        <div id="comparisonTable" class="table-scroll hidden"></div>
        <div id="differencePanel" class="difference-panel hidden"></div>
        <div id="comparisonImages" class="comparison-images hidden"></div>

        <div id="singleResult"><div id="countGrid" class="count-grid" aria-label="" data-i18n-aria-label="results.counts_aria"></div>

        <figure class="result-figure">
          <div class="preview-frame result-image-frame">
            <div class="result-image-visual">
              <img id="annotatedImage" alt="" data-i18n-alt="results.image_alt" />
              <svg id="detectionAreaOverlay" class="detection-area-overlay hidden" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><path class="detection-area-shade" fill-rule="evenodd"></path><polygon class="detection-area-boundary"></polygon></svg>
            </div>
          </div>
          <figcaption id="resultCaption" class="muted"></figcaption>
        </figure>

        <dl class="metadata-grid">
          <div><dt data-i18n="results.filename"></dt><dd id="resultFilename"></dd></div>
          <div><dt data-i18n="results.image_size"></dt><dd id="resultImageSize"></dd></div>
          <div><dt data-i18n="results.profile"></dt><dd id="resultProfile"></dd></div>
          <div><dt data-i18n="results.model"></dt><dd id="resultModel"></dd></div>
          <div><dt data-i18n="results.confidence"></dt><dd id="resultConfidence"></dd></div>
          <div><dt data-i18n="results.cross_class_dedup"></dt><dd id="resultCrossClassDedup"></dd></div>
          <div id="resultCrossClassIouRow"><dt data-i18n="results.cross_class_iou"></dt><dd id="resultCrossClassIou"></dd></div>
          <div><dt data-i18n="results.processing_time"></dt><dd id="resultDuration"></dd></div>
          <div><dt data-i18n="results.received_at"></dt><dd id="resultReceivedAt"></dd></div>
        </dl>

        <details id="detectionsDetails" class="detections-details">
          <summary id="detectionsSummary"></summary>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col" data-i18n="detections.class"></th>
                  <th scope="col" data-i18n="detections.confidence"></th>
                  <th scope="col" data-i18n="detections.coordinates"></th>
                </tr>
              </thead>
              <tbody id="detectionsBody"></tbody>
            </table>
          </div>
        </details>
        </div>

        <div class="result-actions">
          <button id="viewJsonButton" type="button" data-i18n="results.view_json"></button>
        </div>
      </section>

      </div>

      <div id="trainingView" class="hidden">
        <section class="card">
          <div class="section-heading"><div><p class="section-kicker" data-i18n="training.kicker"></p><h2 data-i18n="training.title"></h2></div><span id="trainingTotal" class="status-badge"></span></div>
          <div class="training-toolbar">
            <form id="trainingFilterForm">
              <input id="trainingFilter" type="search" data-i18n-placeholder="training.filter" />
              <select id="trainingPackageFilter" data-i18n-aria-label="training.package_filter"></select>
              <button type="submit" data-i18n="training.search"></button>
            </form>
            <label class="checkbox-row"><input id="selectAllCandidates" type="checkbox" /><span data-i18n="training.select_all"></span></label>
          </div>
          <div class="package-toolbar">
            <form id="packageCreateForm"><input id="packageName" maxlength="250" required data-i18n-placeholder="training.package_name" /><button type="submit" data-i18n="training.create_package"></button></form>
            <select id="packageSelect"></select>
            <button id="addToPackageButton" type="button" disabled data-i18n="training.add_to_package"></button>
          </div>
          <div id="trainingMessage" class="message" role="status"></div>
          <div id="packageContents" class="package-contents hidden"></div>
          <div id="candidateGrid" class="candidate-grid"></div>
        </section>
        <section class="card"><h2 data-i18n="training.packages"></h2><div id="packageList" class="package-list"></div></section>
      </div>

      <footer class="site-footer" data-i18n="app.footer"></footer>
    </main>

    <dialog id="candidateDialog" class="json-dialog" aria-labelledby="candidate-title">
      <form id="candidateForm">
        <h2 id="candidate-title" data-i18n="candidate.title"></h2>
        <fieldset><legend data-i18n="candidate.tags"></legend><div id="candidateTags" class="tag-list"></div></fieldset>
        <label for="candidateReason" data-i18n="candidate.reason"></label>
        <textarea id="candidateReason" maxlength="2000"></textarea>
        <div class="dialog-actions"><button type="submit" data-i18n="candidate.save"></button><button id="cancelCandidateButton" class="secondary-button" type="button" data-i18n="common.cancel"></button></div>
      </form>
    </dialog>

    <dialog id="imageDialog" class="image-dialog"><button id="closeImageButton" class="secondary-button" type="button" data-i18n="common.close"></button><div class="large-image-visual"><img id="largeImage" alt="" /><svg id="largeDetectionAreaOverlay" class="detection-area-overlay hidden" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><path class="detection-area-shade" fill-rule="evenodd"></path><polygon class="detection-area-boundary"></polygon></svg></div></dialog>

    <dialog id="jsonDialog" class="json-dialog" aria-labelledby="json-title">
      <div class="dialog-heading">
        <div>
          <p class="section-kicker" data-i18n="json.kicker"></p>
          <h2 id="json-title" data-i18n="json.title"></h2>
        </div>
        <div class="dialog-actions">
          <button id="downloadJsonButton" class="icon-button" type="button" data-i18n-aria-label="json.download" data-i18n-title="json.download">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M5 19h14" />
            </svg>
          </button>
          <button id="closeJsonButton" class="secondary-button" type="button" data-i18n="json.close"></button>
        </div>
      </div>
      <p class="muted json-help" data-i18n="json.help"></p>
      <pre id="jsonOutput" class="json-output"></pre>
    </dialog>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="./assets/config.js"></script>
    <script src="./assets/app-v2.js?v=__STATIC_VERSION__" defer></script>
  </body>
</html>
