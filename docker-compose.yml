services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: liiklus-api
    env_file:
      - .env
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./models/best.onnx:/app/models/best.onnx:ro
    restart: unless-stopped
    networks:
      - funo_net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: liiklus-ui
    environment:
      MODEL_CONFIDENCE_THRESHOLD: ${MODEL_CONFIDENCE_THRESHOLD}
      NGINX_ENVSUBST_OUTPUT_DIR: /usr/share/nginx/html/assets
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - funo_net

  testing:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles:
      - testing
    env_file:
      - .env
    volumes:
      - ./models/best.onnx:/app/models/best.onnx:ro
    networks:
      - funo_net

networks:
  funo_net:
    external: true
    name: funo_net
