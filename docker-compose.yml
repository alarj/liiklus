services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: liiklus-api
    env_file:
      - .env
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./models/best.onnx:/app/models/best.onnx:ro
    restart: unless-stopped
    networks:
      - funo_net

  testing:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles:
      - testing
    env_file:
      - .env
    volumes:
      - ./models/best.onnx:/app/models/best.onnx:ro
    networks:
      - funo_net

networks:
  funo_net:
    external: true
    name: funo_net
